model:
  name: "ViT-B-32"
  pretrained: "openai"
  logit_scale: 100
  freeze_logit_scale: true
data:
  root: "data/"
  datasets: [OxfordIIITPet, Flowers102, EuroSAT, DTD]
  max_images: 2000
  seed: 0
prompts:
  - "a photo of a {}."
  - "a picture of a {}."
  - "an image of a {}."
  - "a close-up photo of a {}."
  - "a good photo of a {}."
  - "a cropped photo of a {}."
  - "a bright photo of a {}."
  - "a photo of the {}."
  - "a photo of my {}."
  - "a photo of one {}."
finetune:
  optimizer: AdamW
  lr: 1.0e-5
  weight_decay: 0.1
  batch_size: 64
  epochs: 1
runs: [pets, pets_to_flowers, pets_to_eurosat, pets_to_eurosat_textfrozen]
confidence:
  ece_bins: 15
  confident_wrong_threshold: 0.9
